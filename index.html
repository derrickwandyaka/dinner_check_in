/* ============================================ */

const $ = id => document.getElementById(id);
const norm = s => s.trim().toUpperCase().replace(/\s+/g, "");
async function sha(s) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(CONFIG.salt + ":" + s));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
}
function load() { try { return JSON.parse(localStorage.getItem("checkins") || "{}"); } catch { return {}; } }
function save(o) { try { localStorage.setItem("checkins", JSON.stringify(o)); } catch {} }

$("title").textContent = CONFIG.eventName;
let fails = 0, lockedUntil = 0;

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  const out = $("result");
  const now = Date.now();
  if (now < lockedUntil) {
    out.innerHTML = `<span class="bad">Too many attempts. Try again in ${Math.ceil((lockedUntil - now) / 1000)}s.</span>`;
    return;
  }
  const code = norm($("code").value);
  if (!code) return;
  const h = await sha(code);
  const guest = GUESTS.find(g => g.hash === h);

  if (!guest) {
    fails++;
    if (fails >= 5) { lockedUntil = Date.now() + 30000; fails = 0; }
    out.innerHTML = `<span class="bad">❌ Code not found. Please check it and try again.</span>`;
    return;
  }
  fails = 0;
  const log = load();
  let already = !!log[h];
  let time = log[h] || new Date().toISOString();
  if (CONFIG.endpoint) {
    out.innerHTML = '<span class="small">Checking…</span>';
    try {
      const r = await fetch(CONFIG.endpoint + "?hash=" + h + "&name=" + encodeURIComponent(guest.name));
      const d = await r.json();
      if (d.status === "used" && !log[h]) {
        const t = d.time ? " at " + new Date(d.time).toLocaleString([], { dateStyle: "medium", timeStyle: "short" }) : "";
        out.innerHTML = `<span class="bad">⚠️ This code was already used to check in${t}. If this wasn't you, please see the host.</span>`;
        return;
      }
      if (d.status !== "used" && d.status !== "ok") throw new Error("bad response");
      if (d.time) time = d.time;
      already = d.status === "used";
    } catch {
      out.innerHTML = '<span class="bad">Could not reach the check-in server. Check your connection and try again.</span>';
      return;
    }
  }
  if (!log[h]) { log[h] = time; save(log); }
  const when = new Date(time).toLocaleString([], { dateStyle: "medium", timeStyle: "short" });
  out.innerHTML = `<div class="ok"><span class="big">✅</span>You're on the list!<span class="name">${guest.name.replace(/[<>&]/g, "")}</span>
    <span class="small">${already ? "Already checked in" : "Checked in"} · ${when}</span></div>`;
  $("code").value = "";
});

/* Host tool */
if (location.hash === "#host") $("host").style.display = "block";
$("hostBtn").addEventListener("click", async () => {
  const lines = $("hostIn").value.split("\n").map(l => l.trim()).filter(Boolean);
  const rows = [];
  for (const l of lines) {
    const i = l.lastIndexOf(",");
    if (i < 0) continue;
    const name = l.slice(0, i).trim(), code = norm(l.slice(i + 1));
    rows.push(`  { name: ${JSON.stringify(name)}, hash: "${await sha(code)}" }`);
  }
  $("hostOut").textContent = "const GUESTS = [\n" + rows.join(",\n") + "\n];";
});
</script>
